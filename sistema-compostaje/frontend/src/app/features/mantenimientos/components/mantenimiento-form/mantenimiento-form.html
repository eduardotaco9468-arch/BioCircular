<div class="container-fluid"><h3 class="mb-4"><i class="bi bi-tools"></i> Nuevo mantenimiento</h3><div class="card shadow-sm"><div class="card-body"><form [formGroup]="mantenimientoForm" (ngSubmit)="guardar()" class="row g-3">
  <div class="col-md-6"><label class="form-label" for="vehiculoId">Vehículo</label><input id="vehiculoId" type="number" class="form-control" formControlName="vehiculoId" [class.is-invalid]="campoInvalido('vehiculoId')"><div class="invalid-feedback">El vehículo es obligatorio.</div></div>
  <div class="col-md-6"><label class="form-label" for="fecha">Fecha</label><input id="fecha" type="date" class="form-control" formControlName="fecha" [class.is-invalid]="campoInvalido('fecha')"><div class="invalid-feedback">La fecha es obligatoria.</div></div>
  <div class="col-md-6"><label class="form-label" for="tipo">Tipo</label><select id="tipo" class="form-select" formControlName="tipo" [class.is-invalid]="campoInvalido('tipo')"><option value="">Seleccione un tipo</option><option>Preventivo</option><option>Correctivo</option></select><div class="invalid-feedback">El tipo es obligatorio.</div></div>
  <div class="col-md-6"><label class="form-label" for="estado">Estado</label><select id="estado" class="form-select" formControlName="estado" [class.is-invalid]="campoInvalido('estado')"><option value="">Seleccione un estado</option><option>Pendiente</option><option>En proceso</option><option>Finalizado</option></select><div class="invalid-feedback">El estado es obligatorio.</div></div>
  <div class="col-md-8"><label class="form-label" for="descripcion">Descripción</label><textarea id="descripcion" class="form-control" rows="3" formControlName="descripcion" [class.is-invalid]="campoInvalido('descripcion')"></textarea><div class="invalid-feedback">La descripción es obligatoria y debe tener al menos 10 caracteres.</div></div>
  <div class="col-md-4"><label class="form-label" for="costo">Costo</label><input id="costo" type="number" min="0.01" step="0.01" class="form-control" formControlName="costo" [class.is-invalid]="campoInvalido('costo')"><div class="invalid-feedback">Ingrese un costo positivo.</div></div>
  <div class="col-12"><button class="btn btn-success" type="submit"><i class="bi bi-save"></i> Guardar</button></div>
</form></div></div></div>
