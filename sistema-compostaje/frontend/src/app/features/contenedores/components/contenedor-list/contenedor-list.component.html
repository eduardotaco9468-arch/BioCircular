<div class="container-fluid"><div class="d-flex justify-content-between align-items-center mb-4"><h2>Contenedores</h2><button class="btn btn-success" (click)="mostrarFormulario = true"><i class="bi bi-plus-lg"></i> Nuevo contenedor</button></div>
@if (mostrarFormulario) { <div class="card shadow-sm mb-4"><div class="card-body"><app-contenedor-form [contenedor]="contenedorSeleccionado" (guardarContenedor)="guardar($event)" (cancelar)="cerrarFormulario()" /></div></div> }
<div class="card shadow-sm"><div class="card-body table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Código</th><th>Capacidad</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>@for (contenedor of contenedores; track contenedor.id) { <tr><td>{{ contenedor.codigo }}</td><td>{{ contenedor.capacidad }} L</td><td>{{ contenedor.estado }}</td><td><button class="btn btn-sm btn-primary me-2" (click)="editar(contenedor)"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-danger" (click)="eliminar(contenedor.id)"><i class="bi bi-trash"></i></button></td></tr> } @empty { <tr><td colspan="4" class="text-center text-muted">No hay contenedores registrados.</td></tr> }</tbody></table></div></div></div>
