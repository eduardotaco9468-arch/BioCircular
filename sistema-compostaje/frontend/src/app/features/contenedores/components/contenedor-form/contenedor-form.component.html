<form [formGroup]="formulario" (ngSubmit)="guardar()" class="row g-3">
  <div class="col-md-4"><label class="form-label">Código</label><input class="form-control" formControlName="codigo" [class.is-invalid]="formulario.get('codigo')?.invalid && formulario.get('codigo')?.touched"><div class="invalid-feedback">El código es obligatorio.</div></div>
  <div class="col-md-4"><label class="form-label">Capacidad (L)</label><input type="number" class="form-control" formControlName="capacidad" [class.is-invalid]="formulario.get('capacidad')?.invalid && formulario.get('capacidad')?.touched"><div class="invalid-feedback">Ingrese una capacidad válida.</div></div>
  <div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" formControlName="estado"><option>Disponible</option><option>En uso</option><option>Mantenimiento</option></select></div>
  <div class="col-12"><button class="btn btn-success me-2" type="submit">Guardar</button><button class="btn btn-outline-secondary" type="button" (click)="cancelar.emit()">Cancelar</button></div>
</form>
