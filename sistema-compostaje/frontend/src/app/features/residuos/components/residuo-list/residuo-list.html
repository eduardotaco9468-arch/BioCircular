<div class="container-fluid"><div class="d-flex justify-content-between align-items-center mb-4"><h2>Tipos de residuos</h2><a routerLink="/residuos/nuevo" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nuevo tipo de residuo</a></div><div class="card shadow-sm"><div class="card-body table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Nombre</th><th>Tipo</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>@for (residuo of residuos; track residuo.id) { <tr><td>{{ residuo.nombre }}</td><td>{{ residuo.tipo }}</td><td>{{ residuo.descripcion }}</td><td><span class="badge" [class.bg-success]="residuo.estado === 'Activo'" [class.bg-secondary]="residuo.estado === 'Inactivo'">{{ residuo.estado }}</span></td><td><button class="btn btn-sm btn-primary me-2" (click)="editar(residuo)"><i class="bi bi-pencil"></i> Editar</button><button class="btn btn-sm btn-danger" (click)="eliminar(residuo.id)"><i class="bi bi-trash"></i> Eliminar</button></td></tr> } @empty { <tr><td colspan="5" class="text-center text-muted">No hay tipos de residuos registrados.</td></tr> }</tbody></table></div></div></div>
