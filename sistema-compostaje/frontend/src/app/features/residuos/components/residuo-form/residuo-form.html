<div class="container-fluid"><h2 class="mb-4">{{ 'Nuevo tipo de residuo' }}</h2><div class="card shadow-sm"><div class="card-body"><form [formGroup]="residuoForm" (ngSubmit)="guardar()" class="row g-3"><div class="col-md-6"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" formControlName="nombre" [class.is-invalid]="campoInvalido('nombre')"><div class="invalid-feedback">El nombre es obligatorio y debe tener al menos 3 caracteres.</div></div><div class="col-md-6"><label class="form-label" for="tipo">Tipo</label><select id="tipo" class="form-select" formControlName="tipo" [class.is-invalid]="campoInvalido('tipo')"><option value="">Seleccione un tipo</option><option>Orgánico</option><option>Plástico</option><option>Papel</option><option>Vidrio</option><option>Metal</option></select><div class="invalid-feedback">El tipo es obligatorio.</div></div><div class="col-md-6"><label class="form-label" for="estado">Estado</label><select id="estado" class="form-select" formControlName="estado" [class.is-invalid]="campoInvalido('estado')"><option value="">Seleccione un estado</option><option>Activo</option><option>Inactivo</option></select><div class="invalid-feedback">El estado es obligatorio.</div></div><div class="col-12"><label class="form-label" for="descripcion">Descripción</label><textarea id="descripcion" rows="3" class="form-control" formControlName="descripcion" [class.is-invalid]="campoInvalido('descripcion')"></textarea><div class="invalid-feedback">La descripción es obligatoria.</div></div><div class="col-12"><button class="btn btn-success" type="submit"><i class="bi bi-save"></i> Guardar</button></div></form></div></div></div>
