<div class="container-fluid"><h2 class="mb-4">Nuevo registro de inventario</h2><div class="card shadow-sm"><div class="card-body"><form [formGroup]="inventarioForm" (ngSubmit)="guardar()" class="row g-3"><div class="col-md-6"><label class="form-label" for="lote">Lote</label><input id="lote" class="form-control" formControlName="lote" [class.is-invalid]="campoInvalido('lote')"><div class="invalid-feedback">El lote es obligatorio y debe tener al menos 3 caracteres.</div></div><div class="col-md-6"><label class="form-label" for="fechaProduccion">Fecha producción</label><input id="fechaProduccion" type="date" class="form-control" formControlName="fechaProduccion" [class.is-invalid]="campoInvalido('fechaProduccion')"><div class="invalid-feedback">La fecha de producción es obligatoria.</div></div><div class="col-md-4"><label class="form-label" for="cantidad">Cantidad</label><input id="cantidad" type="number" min="0.01" step="0.01" class="form-control" formControlName="cantidad" [class.is-invalid]="campoInvalido('cantidad')"><div class="invalid-feedback">Ingrese una cantidad positiva.</div></div><div class="col-md-4"><label class="form-label" for="unidad">Unidad</label><select id="unidad" class="form-select" formControlName="unidad" [class.is-invalid]="campoInvalido('unidad')"><option value="">Seleccione una unidad</option><option>kg</option><option>toneladas</option></select><div class="invalid-feedback">La unidad es obligatoria.</div></div><div class="col-md-4"><label class="form-label" for="estado">Estado</label><select id="estado" class="form-select" formControlName="estado" [class.is-invalid]="campoInvalido('estado')"><option value="">Seleccione un estado</option><option>En proceso</option><option>Maduración</option><option>Disponible</option><option>Vendido</option></select><div class="invalid-feedback">El estado es obligatorio.</div></div><div class="col-12"><label class="form-label" for="ubicacion">Ubicación</label><input id="ubicacion" class="form-control" formControlName="ubicacion" [class.is-invalid]="campoInvalido('ubicacion')"><div class="invalid-feedback">La ubicación es obligatoria.</div></div><div class="col-12"><button class="btn btn-success" type="submit"><i class="bi bi-save"></i> Guardar</button></div></form></div></div></div>
