<div class="container-fluid"><div class="d-flex justify-content-between align-items-center mb-4"><h2>Vehículos</h2><button class="btn btn-success" (click)="mostrarFormulario = true"><i class="bi bi-plus-lg"></i> Nuevo vehículo</button></div>
@if (mostrarFormulario) { <div class="card shadow-sm mb-4"><div class="card-body"><app-vehiculo-form [vehiculo]="vehiculoSeleccionado" (guardarVehiculo)="guardar($event)" (cancelar)="cerrarFormulario()" /></div></div> }
@if (vehiculoDetalle) { <div class="mb-4"><app-vehiculo-detail [vehiculo]="vehiculoDetalle" /></div> }
<div class="card shadow-sm"><div class="card-body table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Placa</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>@for (vehiculo of vehiculos; track vehiculo.id) { <tr><td>{{ vehiculo.placa }}</td><td>{{ vehiculo.tipo }}</td><td>{{ vehiculo.estado }}</td><td><button class="btn btn-sm btn-outline-secondary me-2" (click)="vehiculoDetalle = vehiculo"><i class="bi bi-eye"></i></button><button class="btn btn-sm btn-primary me-2" (click)="editar(vehiculo)"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-danger" (click)="eliminar(vehiculo.id)"><i class="bi bi-trash"></i></button></td></tr> } @empty { <tr><td colspan="4" class="text-center text-muted">No hay vehículos registrados.</td></tr> }</tbody></table></div></div></div>
