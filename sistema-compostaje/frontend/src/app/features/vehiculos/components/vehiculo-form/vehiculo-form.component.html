<form [formGroup]="formulario" (ngSubmit)="guardar()" class="row g-3"><div class="col-md-4"><label class="form-label">Placa</label><input class="form-control" formControlName="placa" [class.is-invalid]="formulario.get('placa')?.invalid && formulario.get('placa')?.touched"><div class="invalid-feedback">La placa es obligatoria.</div></div><div class="col-md-4"><label class="form-label">Tipo</label><input class="form-control" formControlName="tipo" [class.is-invalid]="formulario.get('tipo')?.invalid && formulario.get('tipo')?.touched"><div class="invalid-feedback">El tipo es obligatorio.</div></div><div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" formControlName="estado"><option>Disponible</option><option>En ruta</option><option>Mantenimiento</option></select></div><div class="col-12"><button class="btn btn-success me-2" type="submit">Guardar</button><button class="btn btn-outline-secondary" type="button" (click)="cancelar.emit()">Cancelar</button></div></form>
