<form [formGroup]="usuarioForm" (ngSubmit)="guardar()">
  <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" formControlName="nombre" [class.is-invalid]="usuarioForm.get('nombre')?.invalid && usuarioForm.get('nombre')?.touched">@if (usuarioForm.get('nombre')?.invalid && usuarioForm.get('nombre')?.touched) {<div class="invalid-feedback">El nombre es obligatorio.</div>}</div>
  <div class="mb-3"><label class="form-label" for="correo">Correo</label><input id="correo" type="email" class="form-control" formControlName="correo" [class.is-invalid]="usuarioForm.get('correo')?.invalid && usuarioForm.get('correo')?.touched">@if (usuarioForm.get('correo')?.invalid && usuarioForm.get('correo')?.touched) {<div class="invalid-feedback">Ingrese un correo válido.</div>}</div>
  <div class="mb-3"><label class="form-label" for="rol">Rol</label><select id="rol" class="form-select" formControlName="rol"><option value="Administrador">Administrador</option><option value="Supervisor">Supervisor</option><option value="Operador">Operador</option></select></div>
  <div class="form-check mb-3"><input id="estado" class="form-check-input" type="checkbox" formControlName="estado"><label class="form-check-label" for="estado">Activo</label></div>
  <button class="btn btn-success me-2" type="submit"><i class="bi bi-save me-1"></i>Guardar Usuario</button><button class="btn btn-outline-secondary" type="button" (click)="cancelarFormulario()">Cancelar</button>
</form>
