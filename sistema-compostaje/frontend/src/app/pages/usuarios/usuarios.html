<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4"><h2>Usuarios</h2><button class="btn btn-success" (click)="abrirModal()"><i class="bi bi-person-plus me-1"></i>Nuevo Usuario</button></div>
  @if (mostrarModal) {<app-usuario-modal [usuarioEditar]="usuarioSeleccionado" (cerrar)="cerrarModal()" (guardar)="guardarUsuario($event)"></app-usuario-modal>}
  <form class="row mb-4" [formGroup]="filtroForm"><div class="col-md-6 mb-2 mb-md-0"><input type="text" class="form-control" placeholder="Buscar por nombre, correo o rol..." formControlName="busqueda"></div><div class="col-md-4"><select class="form-select" formControlName="rolSeleccionado"><option value="">Todos los roles</option><option value="Administrador">Administrador</option><option value="Supervisor">Supervisor</option><option value="Operador">Operador</option></select></div></form>
  <div class="card shadow-sm"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
    @for (usuario of usuariosFiltrados; track usuario.id) {<tr><td>{{ usuario.nombre }}</td><td>{{ usuario.correo }}</td><td>{{ usuario.rol }}</td><td>@if (usuario.estado) {<span class="badge bg-success">Activo</span>} @else {<span class="badge bg-secondary">Inactivo</span>}</td><td><button class="btn btn-sm btn-primary me-2" title="Editar" (click)="editarUsuario(usuario)"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-danger" title="Eliminar" (click)="eliminarUsuario(usuario)"><i class="bi bi-trash"></i></button></td></tr>} @empty {<tr><td colspan="5" class="text-center text-muted py-4">No se encontraron usuarios.</td></tr>}
  </tbody></table></div></div></div>
</div>
