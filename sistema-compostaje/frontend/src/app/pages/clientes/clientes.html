<div class="container-fluid">


    <div class="d-flex justify-content-between align-items-center mb-4">


        <h2>

            Clientes

        </h2>


        <button 
            class="btn btn-success"
            (click)="abrirModal()">

            <i class="bi bi-person-plus"></i>

            Nuevo Cliente

        </button>


    </div>
    @if(mostrarModal){

        <app-cliente-modal

        [clienteEditar]="clienteSeleccionado"

        (cerrar)="cerrarModal()"

        (guardar)="guardarCliente($event)">

        </app-cliente-modal>

    }

    <form class="row mb-4" [formGroup]="filtroForm">


    <div class="col-md-6">


        <input 
        type="text"
        class="form-control"
        placeholder="Buscar cliente..."
        formControlName="busqueda">


    </div>



    <div class="col-md-4">


            <select     
            class="form-select"
            formControlName="tipoSeleccionado">



                <option value="">
                    Todos los tipos
                </option>


                <option value="Residencial">
                    Residencial
                </option>


                <option value="Comercial">
                    Comercial
                </option>


            </select>


        </div>


    </form>




    <div class="card shadow-sm">


        <div class="card-body">


            <div class="table-responsive">


                <table class="table table-hover">


                    <thead>


                        <tr>

                            <th>
                                Nombre
                            </th>

                            <th>
                                Sector
                            </th>

                            <th>
                                Tipo
                            </th>

                            <th>
                                Estado
                            </th>
                            <th>
                                Acciones
                            </th>

                        </tr>


                    </thead>



                    <tbody>


                        @for(cliente of clientesFiltrados; track cliente.id){


                            <tr>


                                <td>

                                    {{cliente.nombre}}

                                </td>


                                <td>

                                    {{cliente.sector}}

                                </td>


                                <td>

                                    {{cliente.tipo}}

                                </td>


                                <td>


                                    @if(cliente.estado){


                                        <span class="badge bg-success">

                                            Activo

                                        </span>


                                    }
                                    @else {


                                        <span class="badge bg-secondary">

                                            Inactivo

                                        </span>


                                    }


                                </td>

                                <td>


                                    <button
                                    class="btn btn-sm btn-primary me-2"
                                    (click)="editarCliente(cliente)">


                                    <i class="bi bi-pencil"></i>


                                    </button>



                                    <button

                                    class="btn btn-sm btn-danger"

                                    (click)="eliminarCliente(cliente)">

                                    <i class="bi bi-trash"></i>

                                    </button>


                                </td>


                            </tr>


                        }


                    </tbody>


                </table>


            </div>


        </div>


    </div>


</div>
