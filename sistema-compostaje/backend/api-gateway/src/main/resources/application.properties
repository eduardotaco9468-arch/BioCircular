# Puerto Gateway
server.port=8080

spring.application.name=api-gateway

# CORS global para las solicitudes del frontend Angular.
# El mapeo adicional permite que las solicitudes OPTIONS (preflight) se resuelvan
# aunque no coincidan con una ruta del gateway.
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# AUTH
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# GESTION
spring.cloud.gateway.routes[1].id=gestion-service
spring.cloud.gateway.routes[1].uri=http://gestion-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/gestion/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# COMPOSTAJE
spring.cloud.gateway.routes[2].id=compostaje-service
spring.cloud.gateway.routes[2].uri=http://compostaje-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/compostaje/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
