spring.application.name=gestion-service

# Puerto del microservicio
server.port=8082

# Base de datos
spring.datasource.url=jdbc:postgresql://gestion-db:5432/gestion_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# JWT
jwt.secret=clave-super-secreta-auth-service-utc-2026-segura
jwt.expiration=3600000
auth.service.url=http://auth-service:8081
