server: { port: 8080 }
spring:
  application: { name: compostaje-service }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://compostaje-db:5432/compostaje_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:biocircular}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:biocircular_local_dev}}
  jpa: { hibernate: { ddl-auto: validate }, open-in-view: false }
  sql: { init: { mode: never } }
management: { endpoints: { web: { exposure: { include: health,info,metrics } } } }
app:
  jwt-secret: "${JWT_SECRET:development_only_change_before_deployment_2026}"
  auditoria-url: "${AUDITORIA_SERVICE_URL:http://auditoria-service:8080}"
  reportes-url: "${REPORTES_SERVICE_URL:http://reportes-service:8080}"
